services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - taskboard-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://taskboard:taskboard@db:5432/taskboard?sslmode=disable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    build: .
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://taskboard:taskboard@db:5432/taskboard?sslmode=disable
      STEP_DELAY: 15s
      LEASE_DURATION: 30s
      HEARTBEAT_INTERVAL: 10s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskboard-data:
